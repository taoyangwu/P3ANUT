#-----------------------------------------------------------------------------#
# P3ANUT configuration template.
#
# Every block in the node graph has a section here. A section supplies the
# DEFAULT value for each parameter only: when a block is dropped onto the
# canvas it takes its own private copy of the defaults, so two blocks of the
# same type can be configured differently without affecting each other or this
# template.
#
# Each parameter follows the pattern:
#   Description   - human readable explanation shown in the parameter popup
#   Type          - String | Int | Float | Boolean | Choice | BooleanList
#   Options       - only for Choice, the permitted values
#   UsedFunctions - the function(s) that actually read the parameter
#   Value         - the default value
#-----------------------------------------------------------------------------#

global:
  configChangeHistory:
    Description: Name of the txt file used to track changes to the config file
    Type: String
    UsedFunctions: configParameterMenu
    Value: configChangeOutput.txt
  errorFileName:
    Description: Name or location of the file to append the error results to
    Type: String
    UsedFunctions: pairedAssembler
    Value: errorData.json

#-----------------------------------------------------------------------------#
# File Input block
#-----------------------------------------------------------------------------#
fileInput:
  startingDirectory:
    Description: Directory the file picker opens in when choosing an input file
    Type: String
    UsedFunctions: FileInputBlock.execute
    Value: ''

#-----------------------------------------------------------------------------#
# Output block
#-----------------------------------------------------------------------------#
outputBlock:
  outputDirectory:
    Description: Folder the incoming data is written to. Chosen with the folder
      icon on the block.
    Type: String
    UsedFunctions: OutputBlock.execute
    Value: ''
  baseFileName:
    Description: File name, without an extension, used when writing the incoming
      data. The extension is chosen automatically from the connection type.
    Type: String
    UsedFunctions: OutputBlock.execute
    Value: output
  overwrite:
    Description: Overwrite the destination file if it already exists. When false a
      numeric suffix is appended instead.
    Type: Boolean
    UsedFunctions: OutputBlock.execute
    Value: true

#-----------------------------------------------------------------------------#
# Literal Input block
#-----------------------------------------------------------------------------#
literalInput:
  valueType:
    Description: How the entered text is interpreted before it is passed on
    Type: Choice
    Options:
      - String
      - Int
      - Float
      - Boolean
    UsedFunctions: LiteralInputBlock.execute
    Value: Int
  value:
    Description: The exact value handed to the connected input
    Type: String
    UsedFunctions: LiteralInputBlock.execute
    Value: '0'

#-----------------------------------------------------------------------------#
# FASTA block - legacy ingestion for files with no per-base quality line
#-----------------------------------------------------------------------------#
fastaBlock:
  dataEnteryLength:
    Description: Number of lines that make up a single record in the file. FASTA
      style files use 2, FASTQ style files use 4. The sequence is always taken
      from the second line of each record.
    Type: Int
    UsedFunctions: readFastaEntries
    Value: 2
  flip_sequence:
    Description: Reverse complement every sequence as it is read. Overridden by the
      Reverse literal input when one is connected.
    Type: Boolean
    UsedFunctions: readFastaEntries
    Value: false
  motrif_presequence_length:
    Description: Number of bases trimmed from the front of every read before the
      motif is kept
    Type: Int
    UsedFunctions: readFastaEntries
    Value: 0
  motrif_postsequence_length:
    Description: Number of bases trimmed from the end of every read before the
      motif is kept
    Type: Int
    UsedFunctions: readFastaEntries
    Value: 0
  dnaDatatag:
    Description: JSON tag the parsed DNA sequence is stored under so that the rest
      of the pipeline can read it
    Type: String
    UsedFunctions: fastaToPipelineData
    Value: sequences

#-----------------------------------------------------------------------------#
# Paired Assembler block
#-----------------------------------------------------------------------------#
pairedAssembler:
  aminoBaseRange:
    Description: How many different offsets the code will check, 3 is all
    Type: Int
    UsedFunctions: aminoConversion
    Value: 3
  cull_maxlength:
    Description: The maximum length of the sequence to be detected by the regex
    Type: Int
    UsedFunctions: parseFastqFile
    Value: 200
  cull_minlength:
    Description: The minimum length of the sequence to be detected by the regex
    Type: Int
    UsedFunctions: parseFastqFile
    Value: 10
  desiredEndingProteinBase:
    Description: The ending barcode of the target protein sequence
    Type: String
    UsedFunctions: aminoConversion
    Value: GGGS
  desiredStartingProteinBase:
    Description: The starting barcode of the target protein sequence
    Type: String
    UsedFunctions: aminoConversion
    Value: SHSS
  errorFileName:
    Description: Name or location of the file to append the error results to
    Type: String
    UsedFunctions: parse
    Value: errorData.json
  fileSeperator:
    Description: Sequence separators for FASTQ files
    Type: String
    UsedFunctions: parseFastqFile
    Value: \+
  includeN:
    Description: Include or exclude the base case N
    Type: Boolean
    UsedFunctions: parseFastqFile
    Value: true
  logFileName:
    Description: Name or location of the file to append the log results to
    Type: String
    UsedFunctions: parse
    Value: logfile.txt
  maintainRunIformation:
    Description: Maintain the additional information about the run included in
      @NB501061:163:HVYLLAFX3:1:11101:1980:1063 1:N:0:GTATTATCT+CATATCGTT. Setting
      this to true takes more memory and will make the final output file larger
    Type: Boolean
    UsedFunctions: parse
    Value: false
  minQualityScore:
    Description: Minimum score to be considered a low quality base, used in exclusion
    Type: Int
    UsedFunctions: finalize
    Value: 20
  minQualityScoreCount:
    Description: Amount of low score qualities needed to consider a read low quality
    Type: Int
    UsedFunctions: finalize
    Value: 10
  multiprocess:
    Description: Boolean toggle to allow the code to multiprocess the pipeline,
      significantly speeds up the pipeline but takes more memory
    Type: Boolean
    UsedFunctions: parseFastqFile
    Value: false
  processLimit:
    Description: Limit of concurrent processes, 0 means use all available resources
    Type: Int
    UsedFunctions: parseFastqFile
    Value: 0
  proteinConversion:
    Description: Determine if the code should attempt to convert the sequence to an
      amino sequence
    Type: Boolean
    UsedFunctions: multiprocess
    Value: true
  radius:
    Description: The radius of k-mer pairs to be considered when merging the sequences
    Type: Int
    UsedFunctions: mergeInsertOperation, mergeDeleteOperation, multiprocess
    Value: 5
  scoreOffset:
    Description: The difference in score that is needed to merge based on k-mers
    Type: Int
    UsedFunctions: mergeInsertOperation, mergeDeleteOperation, multiprocess
    Value: 3
  targetLength:
    Description: Define an optimal length for the sequences that the pipeline will
      try to hit
    Type: Int
    UsedFunctions: mergeMisMatchedLengths
    Value: 66
  level_threshold:
    Description: The maximum number of inserts or deletions found through Levenshtein
      before sequences are dropped. Sequences less than or equal to the threshold
      are kept
    Type: Int
    UsedFunctions: mergeMisMatchedLengths
    Value: 3
  proteinDatatag:
    Description: JSON tag the converted protein sequence is stored under
    Type: String
    UsedFunctions: multiprocess
    Value: proteinSequence
  dnaDatatag:
    Description: JSON tag the merged DNA sequence is stored under
    Type: String
    UsedFunctions: multiprocess
    Value: sequences

#-----------------------------------------------------------------------------#
# Sequence Counter block
#
# Produces exactly three outputs: the counted sequence CSV, a sequence length
# distribution graph and a logo plot.
#-----------------------------------------------------------------------------#
sequenceCount:
  targetLength:
    Description: Number of bases a read must contain to be counted. Overridden by
      the Target Length literal input when one is connected.
    Type: Int
    UsedFunctions: countSequences
    Value: 36
  includeSurrounding:
    Description: Fold in sequences that are exactly one base off the target length
      by matching each of them to the closest correctly sized sequence, instead of
      dropping them
    Type: Boolean
    UsedFunctions: countSequences, foldSurroundingSequences
    Value: false
  sequenceStart:
    Description: The starting peptide barcode a counted sequence must contain
    Type: String
    UsedFunctions: countSequences
    Value: SHSS
  sequenceEnd:
    Description: The ending peptide barcode a counted sequence must contain
    Type: String
    UsedFunctions: countSequences
    Value: GGGS
  matchBarcodes:
    Description: Require the start and end barcodes to be present. When false every
      sequence of the target length is counted.
    Type: Boolean
    UsedFunctions: countSequences
    Value: true
  middleMinLength:
    Description: The minimum length, in amino acids, of the sequence between the two
      barcodes
    Type: Int
    UsedFunctions: barcodeRegexStatements
    Value: 3
  middleMaxLength:
    Description: The maximum length, in amino acids, of the sequence between the two
      barcodes
    Type: Int
    UsedFunctions: barcodeRegexStatements
    Value: 10
  aminoConversion:
    Description: Convert the DNA reads to amino acid sequences before counting. When
      false the DNA sequences are counted directly.
    Type: Boolean
    UsedFunctions: countSequences
    Value: true
  dnaDatatag:
    Description: The JSON tag that stores the DNA sequence within the incoming data
    Type: String
    UsedFunctions: countSequences
    Value: sequences
  proteinDatatag:
    Description: The JSON tag that stores the protein sequence within the incoming
      data
    Type: String
    UsedFunctions: countSequences
    Value: proteinSequence
  minimumCount:
    Description: The minimum number of occurrences of a sequence for it to be kept
    Type: Int
    UsedFunctions: countSequences
    Value: 1
  normalizeCount:
    Description: Divide every count by the total number of reads in the file so runs
      of different depth can be compared
    Type: Boolean
    UsedFunctions: countSequences
    Value: false
  method:
    Description: The counting metric applied to the selected sequences. Options are
      direct, DBSCAN or OPTICS. An unknown value falls back to direct counting.
    Type: Choice
    Options:
      - direct
      - DBSCAN
      - OPTICS
    UsedFunctions: countSequences
    Value: direct
  encoding:
    Description: Encoding used to turn a character sequence into a numeric one so
      that it can be clustered. Only used by the DBSCAN and OPTICS methods.
    Type: Choice
    Options:
      - ONEHOT
      - BLOSUM
      - None
    UsedFunctions: seqEncoding
    Value: ONEHOT
  eps:
    Description: Maximum distance between neighbours, used by DBSCAN
      https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html
    Type: Float
    UsedFunctions: dbScanCount
    Value: 0.5
  min_samples:
    Description: Minimum number of elements to be considered a neighbourhood, used
      by DBSCAN and OPTICS
    Type: Int
    UsedFunctions: dbScanCount, opticsCount
    Value: 5
  logoValidBases:
    Description: Ordered alphabet used to build the logo plot matrix
    Type: String
    UsedFunctions: logoplot
    Value: CS*TAGPDEQNHKRMILVWYF
  dpi:
    Description: Resolution, in dots per inch, of the length distribution and logo
      plot images
    Type: Int
    UsedFunctions: countSequences
    Value: 300

#-----------------------------------------------------------------------------#
# Run Unifier block
#-----------------------------------------------------------------------------#
runUnifier:
  inputCount:
    Description: Number of file inputs the block starts with. The plus and minus
      buttons on the block change this after it has been placed.
    Type: Int
    UsedFunctions: RunUnifierBlock.portSpecs
    Value: 2

#-----------------------------------------------------------------------------#
# Volcano Plot block
#-----------------------------------------------------------------------------#
volcanoPlot:
  ratio:
    Description: A/B ratio threshold splitting the plot horizontally. Overridden by
      the Ratio literal input when one is connected.
    Type: Float
    UsedFunctions: run_volcano_plot
    Value: 1.0
  pvalue:
    Description: -log10(p-value) threshold splitting the plot vertically. Overridden
      by the P-Value literal input when one is connected.
    Type: Float
    UsedFunctions: run_volcano_plot
    Value: 1.3
  quadrant:
    Description: Quadrant exported on the Data output. 1 is above the ratio and
      above the p-value threshold.
    Type: Choice
    Options:
      - 1
      - 2
      - 3
      - 4
    UsedFunctions: returnQuadrant
    Value: 1
  figureWidth:
    Description: Width of the exported figure in inches
    Type: Float
    UsedFunctions: run_volcano_plot
    Value: 8.0
  figureHeight:
    Description: Height of the exported figure in inches
    Type: Float
    UsedFunctions: run_volcano_plot
    Value: 6.0
  dpi:
    Description: Resolution of the exported figure in dots per inch
    Type: Int
    UsedFunctions: run_volcano_plot
    Value: 300

#-----------------------------------------------------------------------------#
# Upset Plot block
#-----------------------------------------------------------------------------#
upsetPlot:
  inputCount:
    Description: Number of file inputs the block starts with. The plus and minus
      buttons on the block change this after it has been placed.
    Type: Int
    UsedFunctions: UpsetPlotBlock.portSpecs
    Value: 2
  selection:
    Description: One true or false per connected file saying which files take part
      in the exported intersection. An empty list includes every file, which is the
      intersection across all of them.
    Type: BooleanList
    UsedFunctions: run_upset_plot
    Value: []
  figureWidth:
    Description: Width of the exported figure in inches
    Type: Float
    UsedFunctions: run_upset_plot
    Value: 14.0
  figureHeight:
    Description: Height of the exported figure in inches
    Type: Float
    UsedFunctions: run_upset_plot
    Value: 6.0
  dpi:
    Description: Resolution of the exported figure in dots per inch
    Type: Int
    UsedFunctions: run_upset_plot
    Value: 300

#-----------------------------------------------------------------------------#
# Ranking Plot block
#-----------------------------------------------------------------------------#
rankingPlot:
  inputCount:
    Description: Number of target sequence inputs the block starts with. The plus
      and minus buttons on the block change this after it has been placed.
    Type: Int
    UsedFunctions: run_ranking_plot
    Value: 1
  slope:
    Description: Slope of the separation line. Overridden by the Slope literal input
      when one is connected.
    Type: Float
    UsedFunctions: run_ranking_plot
    Value: 1.0
  b:
    Description: Y-intercept of the separation line
    Type: Float
    UsedFunctions: run_ranking_plot
    Value: 0.0
  points:
    Description: Cutoff applied when selecting sequences, read as a count or a
      percentage depending on percentOrCount. Overridden by the Top N literal input
      when one is connected.
    Type: Float
    UsedFunctions: gatherScatterData
    Value: 100
  percentOrCount:
    Description: Whether the points cutoff is a fixed number of sequences (#) or a
      percentage of the file (%)
    Type: Choice
    Options:
      - '#'
      - '%'
    UsedFunctions: gatherScatterData
    Value: '#'
  countFile1:
    Description: Include the File A sequences when choosing which sequences to rank
    Type: Boolean
    UsedFunctions: gatherScatterData
    Value: true
  countFile2:
    Description: Include the File B sequences when choosing which sequences to rank
    Type: Boolean
    UsedFunctions: gatherScatterData
    Value: false
  logScale:
    Description: Draw the Y axis of the ranking plot on a log scale
    Type: Boolean
    UsedFunctions: run_ranking_plot
    Value: false
  figureWidth:
    Description: Width of the exported figure in inches
    Type: Float
    UsedFunctions: run_ranking_plot
    Value: 6.0
  figureHeight:
    Description: Height of the exported figure in inches
    Type: Float
    UsedFunctions: run_ranking_plot
    Value: 4.0
  dpi:
    Description: Resolution of the exported figure in dots per inch
    Type: Int
    UsedFunctions: run_ranking_plot
    Value: 300
